<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>VOID SIEGE</title>
<style>
html,body{margin:0;background:#05060f;color:#9fe8ff;font-family:monospace;overflow:hidden}
#c{display:block;margin:0 auto;background:#070a18;cursor:crosshair}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 16px;font-size:18px;text-shadow:0 0 6px #0af;pointer-events:none;z-index:5}
#msg{position:fixed;top:40%;width:100%;text-align:center;font-size:34px;z-index:6;pointer-events:none;text-shadow:0 0 14px #08f}
#bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:10px;background:rgba(10,14,30,.92);z-index:5}
.tbtn{border:1px solid #2af;background:#0a1430;color:#bfe;padding:8px 14px;font-family:monospace;font-size:15px;cursor:pointer;border-radius:4px}
.tbtn.sel{background:#1c3a7a;box-shadow:0 0 10px #2af}
.tbtn small{color:#8ac;display:block;font-size:11px}
</style></head>
<body>
<div id="hud"><span id="hGold">GOLD 120</span><span id="hWave">WAVE 0</span><span id="hLives">LIVES 20</span><span id="hScore">SCORE 0</span></div>
<div id="msg">VOID SIEGE<br><span style="font-size:18px">Place towers. Stop the void before it eats the core.<br>Click PLAY to start. P = pause. 1-4 pick tower.</span></div>
<canvas id="c" width="960" height="600"></canvas>
<div id="bar">
 <button class="tbtn sel" data-t="0">PEW [40]<small>fast single</small></button>
 <button class="tbtn" data-t="1">BLAST [70]<small>splash</small></button>
 <button class="tbtn" data-t="2">FROST [60]<small>slows</small></button>
 <button class="tbtn" data-t="3">RAIL [90]<small>sniper</small></button>
 <button class="tbtn" data-t="4">UPGRADE<small>on tower</small></button>
 <button class="tbtn" data-t="5">SELL<small>70% back</small></button>
</div>
<script src="js/engine.js"></script>
</body></html>
